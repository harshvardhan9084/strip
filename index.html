<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0B0F">
<title>Strip</title>

<body>

<div id="hud">
  <div id="hud-title">STRIP</div>
  <div id="hud-right">
    <button id="drawer-btn" aria-label="All cartridges" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>
    </button>
    <button id="lock-btn" aria-label="Lock scroll" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </button>
    <button id="settings-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.6 1.65 1.65 0 0 0 4.27 6.78l-.06-.06A2 2 0 1 1 6.99 3l.06.06A1.65 1.65 0 0 0 8.87 4.6a1.65 1.65 0 0 0 1.51-1H11a2 2 0 1 1 4 0h-.09a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.06.06A2 2 0 1 1 19.4 6.78l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1 1.51H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div id="hud-index">01</div>
  </div>
</div>

<div id="lock-toast">Scroll locked</div>

<main id="strip" tabindex="0" aria-label="Infinite mini-game strip">
  <!-- Cartridge panels injected here by js/app.js -->
</main>

<div id="settings-overlay">
  <div id="settings-panel">
    <div class="settings-header">
      <div class="settings-title">SETTINGS</div>
      <button id="settings-close" aria-label="Close settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="settings-body">
      <label class="setting-row">
        <div class="setting-text">
          <div class="setting-label">Lock scroll</div>
          <div class="setting-desc">Freeze the strip so swipes inside a game can't flip the card</div>
        </div>
        <input type="checkbox" class="setting-toggle" data-key="lockScroll">
      </label>

      <label class="setting-row">
        <div class="setting-text">
          <div class="setting-label">Reduce motion</div>
          <div class="setting-desc">Turn off scanlines, flicker, and other non-essential animation</div>
        </div>
        <input type="checkbox" class="setting-toggle" data-key="reduceMotion">
      </label>

      <label class="setting-row">
        <div class="setting-text">
          <div class="setting-label">Haptics</div>
          <div class="setting-desc">Vibration feedback on taps, where supported</div>
        </div>
        <input type="checkbox" class="setting-toggle" data-key="haptics">
      </label>

      <label class="setting-row">
        <div class="setting-text">
          <div class="setting-label">Sound</div>
          <div class="setting-desc">Audio in games that use sound, like Tone Pad</div>
        </div>
        <input type="checkbox" class="setting-toggle" data-key="sound">
      </label>

      <div style="margin-top:12px"></div>

      <!-- Install button added to settings -->
      <button id="install-setting-btn" class="btn" style="width:100%;">Install to play offline</button>
      <div id="install-note" class="setting-desc" style="text-align:center; margin-top:6px; display:none;">If your browser doesn't show a prompt, use the browser menu (⋮) → "Install app" or "Add to Home screen".</div>

      <div class="settings-divider"></div>

      <button id="clear-progress-btn" class="btn" style="width:100%; border-color:var(--danger); color:var(--danger);">
        Clear all progress
      </button>
      <div class="setting-desc" style="text-align:center; margin-top:6px;">Erases every game's saves and highscores. Can't be undone.</div>
    </div>
  </div>
</div>

<div id="boot">
  <div id="boot-logo">STRIP</div>
  <div id="boot-sub">loading cartridges…</div>
</div>
